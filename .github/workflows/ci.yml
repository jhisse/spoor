name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOSEC_VERSION: v2.29.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found unformatted files, run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: line budget
        run: make loc

      - name: go test -race
        run: go test ./... -race

      # Only checks that the image builds; nothing is pushed.
      - name: docker build
        run: docker build -t spoor:ci .

      # Keyed by the pinned tool versions: a version bump invalidates the cache.
      - name: cache lint/security tools
        id: cache-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-gosec-${{ env.GOSEC_VERSION }}-govulncheck-${{ env.GOVULNCHECK_VERSION }}

      - name: install golangci-lint
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: install gosec
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: gosec
        run: gosec ./...

      - name: install govulncheck
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck
        run: govulncheck ./...
