name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOSEC_VERSION: v2.29.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found unformatted files, run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: line budget
        run: make loc

      - name: go test -race
        run: go test ./... -race

      # Only checks that the image builds; nothing is pushed.
      - name: docker build
        run: docker build -t spoor:ci .

      # Keyed by the pinned tool versions: a version bump invalidates the cache.
      # Saved right after the install, so a later failing step does not throw
      # the tools away (actions/cache only saves when the whole job succeeds).
      - name: restore lint/security tools
        id: cache-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-gosec-${{ env.GOSEC_VERSION }}-govulncheck-${{ env.GOVULNCHECK_VERSION }}

      - name: install lint/security tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: save lint/security tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ steps.cache-tools.outputs.cache-primary-key }}

      - name: golangci-lint
        run: golangci-lint run ./...

      # gosec v2.29.0 cannot read Go 1.27.2 export data (securego/gosec#1771):
      # it analyses the code with Go 1.27.1 until v2.29.1 ships.
      - name: gosec
        run: GOTOOLCHAIN=go1.27.1 gosec ./...

      - name: govulncheck
        run: govulncheck ./...
